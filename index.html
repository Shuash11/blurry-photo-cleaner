<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- INF-2 (plan v2 Phase R2): strict meta CSP. GitHub Pages cannot send
       HTTP headers, so the policy ships in the document (MDN: the same
       restrictions can be applied via the <meta> element). Each directive
       was verified against the app's real mechanics:
         default-src 'self'   — fallback for every fetch directive (fonts,
                                media, frames are unused; system fonts only,
                                §14.1); remote origins blocked everywhere.
         script-src 'self'    — the one module entry js/main.js; no inline
                                scripts, no eval, no remote code.
         style-src 'self'     — css/style.css only; no <style> elements and
                                no style="" attributes exist in the app, and
                                JS styles via CSSOM property writes
                                (el.style.*), which CSP does not block — so
                                no 'unsafe-inline'.
         img-src 'self' blob: — thumbnails, the detail stage, and the
                                download anchors are blob: object URLs; the
                                favicon is same-origin assets/mark.svg; no
                                data: URIs exist in app code.
         worker-src 'self'    — blur-worker.js is a same-origin module worker
                                (never blob:/data:; per MDN, only
                                blob:/data:-origin workers inherit the
                                document's policy).
         connect-src 'none'   — the "photos never leave this device" promise
                                made structural: fetch/XHR/WebSocket/
                                sendBeacon all fail by policy.
         object-src 'none'; base-uri 'none' — no <object>/<embed>; no <base>
                                (blocks <base> URL hijacking).
       frame-ancestors is deliberately ABSENT: MDN — "this directive is not
       supported in the <meta> element", and it does not fall back to
       default-src. Header-only enforcement is impossible on Pages; the app
       has no auth and no state-changing requests, so embedding risk is nil. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob:; worker-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#141517">
  <meta name="description" content="Find the blurry photos in your library. Photos never leave this device.">
  <title>Blurry Photo Cleaner</title>
  <link rel="icon" href="assets/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css?v=v0.4.0">
</head>
<body>

  <!-- Inline SVG icon set (design spec §8.2): one set, stroke=currentColor, 1.5px stroke,
       20px default size. No icon font, no CDN, no emoji. The mark is the only filled glyph
       (the app mark — the one accent moment in the chrome). -->
  <svg class="svg-defs" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="icon-photo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="5" width="18" height="14" rx="2.5"/>
        <circle cx="8.8" cy="9.8" r="1.6"/>
        <path d="M3.5 16.8l4.3-4.3a1.2 1.2 0 0 1 1.7 0l2.6 2.6 3.1-3.1a1.2 1.2 0 0 1 1.7 0l3.6 3.6"/>
      </symbol>
      <symbol id="icon-folder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3.5 7.2c0-1.05.85-1.9 1.9-1.9h3.9l2 2.1h7.3c1.05 0 1.9.85 1.9 1.9v8.5c0 1.05-.85 1.9-1.9 1.9H5.4c-1.05 0-1.9-.85-1.9-1.9V7.2z"/>
      </symbol>
      <symbol id="icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12.6l4.4 4.4L19 7.6"/>
      </symbol>
      <symbol id="icon-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6.2 6.2l11.6 11.6M17.8 6.2L6.2 17.8"/>
      </symbol>
      <symbol id="icon-chevron-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14.6 5.6L8.2 12l6.4 6.4"/>
      </symbol>
      <symbol id="icon-chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9.4 5.6L15.8 12l-6.4 6.4"/>
      </symbol>
      <symbol id="icon-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 4.5v9.3M8.2 10.5l3.8 3.8 3.8-3.8M5 17.2v1.1c0 .66.54 1.2 1.2 1.2h11.6c.66 0 1.2-.54 1.2-1.2v-1.1"/>
      </symbol>
      <symbol id="icon-warning" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.4 4.9L2.9 18.1c-.5.9.13 2 1.16 2h15.88c1.03 0 1.66-1.1 1.16-2L13.6 4.9c-.52-.9-1.68-.9-2.2 0z"/>
        <path d="M12 9.5v4.4"/>
        <path d="M12 16.9h.01"/>
      </symbol>
      <symbol id="icon-mark" viewBox="0 0 24 24">
        <rect x="2.5" y="2.5" width="19" height="19" rx="5.5" fill="currentColor" stroke="none"/>
        <circle cx="12" cy="12" r="4.2" fill="none" stroke="#FFFFFF"/>
      </symbol>
    </defs>
  </svg>

  <div class="app">
    <header class="app-header">
      <h1 class="app-title">
        <span class="app-mark" aria-hidden="true"><svg class="icon icon--mark"><use href="#icon-mark"></use></svg></span>
        Blurry Photo Cleaner
      </h1>
      <button type="button" id="start-over-btn" class="btn-text" hidden>Start over</button>
    </header>

    <!-- Single polite live region (design spec §12). Notice cards carry their own
         role="status"; this region announces counts and clear/add outcomes. -->
    <p id="live-region" class="visually-hidden" role="status" aria-live="polite"></p>

    <!-- The whole content area is the drop zone (design spec §8.2). -->
    <main id="content" class="content">
      <div id="view-root" class="view-root"></div>
    </main>
  </div>

  <!-- Core input (plan Decision Record): file picker with drag-drop. -->
  <input id="file-input" class="hidden-input" type="file" accept="image/*" multiple tabindex="-1" aria-hidden="true">

  <script type="module" src="js/main.js?v=v0.4.0"></script>
</body>
</html>
