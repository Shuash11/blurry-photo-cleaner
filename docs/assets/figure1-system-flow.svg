<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" role="img" aria-labelledby="fig1-title fig1-desc">
  <title id="fig1-title">System flow: Input, Process, Output</title>
  <desc id="fig1-desc">Selected photo files go in; each photo is decoded upright, downscaled to a 256-pixel working image, converted to grayscale, scored with Laplacian variance, normalized to 0-100, and grouped into Blurry, Needs review, or Sharp; the output is a grouped review grid with downloads.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1E6EF4"/>
    </marker>
  </defs>

  <style>
    .box { fill: #FFFFFF; stroke: #000000; stroke-opacity: 0.15; stroke-width: 1; }
    .box-title { font: 600 15px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #000000; }
    .box-line { font: 400 12.5px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #636366; }
    .box-strong { font: 600 12.5px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #000000; }
    .step-num { font: 400 11px ui-monospace, "SF Mono", Menlo, Consolas, monospace; fill: #6E6E73; }
    .step-text { font: 400 12.5px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #000000; }
    .note { font: 400 11px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #6E6E73; }
    .sep { stroke: #000000; stroke-opacity: 0.08; stroke-width: 1; }
    .flow { stroke: #1E6EF4; stroke-width: 2; fill: none; }
  </style>

  <!-- Input box -->
  <rect class="box" x="24" y="104" width="200" height="162" rx="10"/>
  <text class="box-title" x="44" y="134">Input</text>
  <line class="sep" x1="44" y1="148" x2="204" y2="148"/>
  <text class="box-strong" x="44" y="174">Selected photo files</text>
  <text class="box-line" x="44" y="196">file picker, drag-and-drop,</text>
  <text class="box-line" x="44" y="214">or folder pick</text>
  <text class="note" x="44" y="246">Photos never leave</text>
  <text class="note" x="44" y="262">the device.</text>

  <!-- Input -> Process -->
  <line class="flow" x1="228" y1="185" x2="292" y2="185" marker-end="url(#arrow)"/>

  <!-- Process box -->
  <rect class="box" x="300" y="24" width="320" height="322" rx="10"/>
  <text class="box-title" x="320" y="54">Process</text>
  <text class="note" x="320" y="72">per photo, in a background Web Worker</text>
  <line class="sep" x1="320" y1="84" x2="600" y2="84"/>

  <text class="step-num" x="320" y="110">1</text>
  <text class="step-text" x="340" y="110">Decode the photo upright (EXIF honored)</text>
  <line class="sep" x1="320" y1="124" x2="600" y2="124"/>

  <text class="step-num" x="320" y="150">2</text>
  <text class="step-text" x="340" y="150">Downscale to a 256 px working image</text>
  <line class="sep" x1="320" y1="164" x2="600" y2="164"/>

  <text class="step-num" x="320" y="190">3</text>
  <text class="step-text" x="340" y="190">Convert to grayscale</text>
  <line class="sep" x1="320" y1="204" x2="600" y2="204"/>

  <text class="step-num" x="320" y="230">4</text>
  <text class="step-text" x="340" y="230">Laplacian variance (edge energy)</text>
  <line class="sep" x1="320" y1="244" x2="600" y2="244"/>

  <text class="step-num" x="320" y="270">5</text>
  <text class="step-text" x="340" y="270">Normalize to a 0&#8211;100 sharpness score</text>
  <line class="sep" x1="320" y1="284" x2="600" y2="284"/>

  <text class="step-num" x="320" y="310">6</text>
  <text class="step-text" x="340" y="310">Cut into 3 bands</text>
  <text class="note" x="340" y="330">under 40 Blurry &#183; 40&#8211;59 Needs review &#183; 60+ Sharp</text>

  <!-- Process -> Output -->
  <line class="flow" x1="624" y1="185" x2="688" y2="185" marker-end="url(#arrow)"/>

  <!-- Output box -->
  <rect class="box" x="696" y="104" width="200" height="162" rx="10"/>
  <text class="box-title" x="716" y="134">Output</text>
  <line class="sep" x1="716" y1="148" x2="876" y2="148"/>
  <text class="box-strong" x="716" y="174">Grouped review grid</text>
  <text class="box-line" x="716" y="196"><tspan fill="#BB1125">Blurry</tspan><tspan fill="#6E6E73"> &#183; </tspan><tspan fill="#A34400">Needs review</tspan><tspan fill="#6E6E73"> &#183; </tspan><tspan fill="#007029">Sharp</tspan></text>
  <text class="box-line" x="716" y="218">with counts and scores</text>
  <text class="note" x="716" y="246">select the blurry ones,</text>
  <text class="note" x="716" y="262">download, delete on the phone</text>
</svg>
